name: sadhana_app
description: Devotional Digital Ecosystem - A New Era for Devotees
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.0
  cloud_firestore: ^4.15.0
  firebase_storage: ^11.6.0
  firebase_messaging: ^14.7.19

  # Auth
  google_sign_in: ^6.2.1

  # State management
  provider: ^6.1.2

  # Navigation
  go_router: ^13.2.1

  # Payments
  razorpay_flutter: ^1.3.6

  # UI
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.0
  flutter_svg: ^2.0.10+1
  intl: ^0.19.0
  url_launcher: ^6.2.6
  share_plus: ^9.0.0
  image_picker: ^1.0.7
  file_picker: ^6.1.1

  # Storage
  shared_preferences: ^2.2.3

  # Video
  youtube_player_flutter: ^8.1.2
  video_player: ^2.8.3

  # Utils
  connectivity_plus: ^6.0.3
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
